# By hand: gives c4n-api (worker.yml) its secrets, straight from this repository's
# Actions secrets into Cloudflare. Nothing is printed.
#   GITHUB_APP_PRIVATE_KEY      <- SUGGEST_EDIT_APP_PRIVATE_KEY (the App's .pem), base64-encoded
#   GITHUB_OAUTH_CLIENT_SECRET  <- SIGNIN_OAUTH_CLIENT_SECRET (the OAuth App whose
#                                  callback is https://api.confused4now.org/api/github-auth)
#   IDENTITY_SECRET             <- IDENTITY_SECRET: the same value as Vercel's, because
#                                  GitHub sign-in is served here and the proposals it
#                                  signs are checked on Vercel (batch 2d split). Without
#                                  that secret: generated here, as before, only if the
#                                  Worker has none or `rotate_identity` is ticked.
# FORWARD_SECRET is deleted from the Worker if it is still there: writes are no longer
# forwarded to Vercel (13 Oct).
# Run it after rotating either key. The Worker must have been deployed once.
name: worker-secrets

on:
  workflow_dispatch:
    inputs:
      rotate_identity:
        description: Generate a new IDENTITY_SECRET (signs everyone out of GitHub sign-in)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: c4n-api-deploy
  cancel-in-progress: false

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Copy the secrets into the Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_TOKEN }}
          APP_KEY: ${{ secrets.SUGGEST_EDIT_APP_PRIVATE_KEY }}
          OAUTH_SECRET: ${{ secrets.SIGNIN_OAUTH_CLIENT_SECRET }}
          ROTATE: ${{ inputs.rotate_identity }}
          SHARED_IDENTITY: ${{ secrets.IDENTITY_SECRET }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN APP_KEY OAUTH_SECRET; do
            [ -n "${!name}" ] || { echo "::error::$name is empty: set the matching secret on this repository first."; exit 1; }
          done
          export CLOUDFLARE_ACCOUNT_ID="$(curl -fsS --max-time 20 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            'https://api.cloudflare.com/client/v4/zones?name=confused4now.org' | jq -er '.result[0].account.id')"
          printf '%s\n' "$APP_KEY" | grep -q -- '-----BEGIN' || { echo "::error::SUGGEST_EDIT_APP_PRIVATE_KEY is not a PEM."; exit 1; }

          have="$(npx -y wrangler@4.142.0 secret list --name c4n-api --format json | jq -r '.[].name')"
          file="$RUNNER_TEMP/secrets.json"
          trap 'rm -f "$file"' EXIT
          umask 077
          if [ -n "$SHARED_IDENTITY" ]; then
            identity="$SHARED_IDENTITY"
            echo "IDENTITY_SECRET: the shared one (as on Vercel)."
          elif [ "$ROTATE" = true ] || ! grep -qx IDENTITY_SECRET <<<"$have"; then
            identity="$(openssl rand -hex 32)"
            echo "IDENTITY_SECRET: new."
          else
            identity=""
            echo "IDENTITY_SECRET: kept."
          fi
          jq -n --arg key "$(printf '%s\n' "$APP_KEY" | base64 -w0)" --arg oauth "$OAUTH_SECRET" --arg id "$identity" \
            '{ GITHUB_APP_PRIVATE_KEY: $key, GITHUB_OAUTH_CLIENT_SECRET: $oauth } + (if $id == "" then {} else { IDENTITY_SECRET: $id } end)' > "$file"
          npx -y wrangler@4.142.0 secret bulk "$file" --name c4n-api > /dev/null
          if grep -qx FORWARD_SECRET <<<"$have"; then
            printf 'y\n' | npx -y wrangler@4.142.0 secret delete FORWARD_SECRET --name c4n-api > /dev/null
            echo "FORWARD_SECRET: deleted."
          fi
          echo "c4n-api now has: $(npx -y wrangler@4.142.0 secret list --name c4n-api --format json | jq -r '[.[].name] | join(", ")')."
