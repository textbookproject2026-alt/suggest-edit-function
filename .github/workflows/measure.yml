# By hand: CPU time per route on the c4n-api Worker, cold, first load and warm, against
# the free plan's 10 ms (the target is p95 under 8). Each round deploys the same code
# again as a new version, so it runs in fresh isolates: the round's first request of
# each route then loads that route's code (load=1), and the rest are warm
# (scripts/measure-load.mjs). `wrangler tail` records every request; the summary is
# scripts/cpu-summary.mjs, and the raw tail is kept as an artifact.
#
# It deploys the ref it runs on (normally main). Nothing is written anywhere: the
# traffic carries the honeypot, and history and revision reads only read.
name: measure

on:
  workflow_dispatch:
    inputs:
      rounds:
        description: Fresh deployments to measure (each gives every route one first load)
        default: '8'
      notes:
        description: One real note per round on the platform test book (close and label them platform-test afterwards)
        type: boolean
        default: false
      focus:
        description: Only reader names (first load) and author-sync, one each per fresh version; up to 45 rounds
        type: boolean
        default: false
      record_minutes:
        description: Only record (no deploys, no traffic) for this many minutes, up to 35, while someone uses the Worker by hand
        default: '0'

permissions:
  contents: read

concurrency:
  group: c4n-api-deploy
  cancel-in-progress: false

env:
  WRANGLER: wrangler@4.142.0
  WRANGLER_SEND_METRICS: 'false'
  BASE: https://api.confused4now.org

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Bundle the registry, find the bindings, refresh ahead, start the tail
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_TOKEN }}
          APP_KEY: ${{ secrets.SUGGEST_EDIT_APP_PRIVATE_KEY }}
          RECORD: ${{ inputs.record_minutes || '0' }}
        run: |
          set -euo pipefail
          npm ci
          FUNCTION_SHA="$(git rev-parse HEAD)" npm run registry:bundle
          scripts/cloudflare-bindings.sh
          export CLOUDFLARE_ACCOUNT_ID="$(sed -n 's/^CLOUDFLARE_ACCOUNT_ID=//p' "$GITHUB_ENV" | tail -1)"
          # What refresh.yml keeps ahead, as it would be: the reads then measure what readers get.
          CACHE_ID="$(sed -n 's/^CACHE_ID=//p' "$GITHUB_ENV" | tail -1)" \
          GITHUB_APP_ID="$(sed -n 's/^GITHUB_APP_ID = "\([0-9]*\)"/\1/p' wrangler.toml)" \
          GITHUB_APP_PRIVATE_KEY="$(printf '%s\n' "$APP_KEY" | base64 -w0)" \
            node scripts/refresh.mjs
          [[ "$RECORD" =~ ^[0-9]{1,2}$ ]] || { echo "::error::record_minutes must be a number of minutes."; exit 1; }
          record=$(( RECORD > 35 ? 35 : RECORD ))
          nohup timeout $(( record > 0 ? record * 60 + 60 : 2100 )) npx -y "$WRANGLER" tail c4n-api --format json > "$RUNNER_TEMP/tail.jsonl" 2> "$RUNNER_TEMP/tail.err" &
          sleep 15
      - name: Record
        if: inputs.record_minutes != '' && inputs.record_minutes != '0'
        env:
          RECORD: ${{ inputs.record_minutes }}
        run: |
          minutes=$(( RECORD > 35 ? 35 : RECORD ))
          echo "::notice::Recording the Worker for $minutes minutes, from $(date -u +%H:%M) UTC."
          sleep $(( minutes * 60 ))
      - name: Rounds
        if: inputs.record_minutes == '' || inputs.record_minutes == '0'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          ROUNDS: ${{ inputs.rounds }}
          NOTES: ${{ inputs.notes && '1' || '0' }}
          FOCUS: ${{ inputs.focus && '1' || '0' }}
        run: |
          set -euo pipefail
          max=$([ "$FOCUS" = 1 ] && echo 45 || echo 20)
          rounds=$(( ROUNDS > max ? max : ROUNDS ))
          for round in $(seq "$rounds"); do
            # Up to three tries: Cloudflare's API sometimes answers an upload with a
            # malformed response (12 Oct), which shouldn't end the whole measurement.
            version=""
            for try in 1 2 3; do
              version="$(npx -y "$WRANGLER" versions upload --message "measure ${round}/${rounds}" 2>&1 | tee /dev/stderr | grep -oE 'Version ID: [0-9a-f-]{36}' | head -1 | cut -d' ' -f3 || true)"
              [ -n "$version" ] && break
              sleep 10
            done
            [ -n "$version" ] || { echo "::error::No version id from the upload."; exit 1; }
            npx -y "$WRANGLER" versions deploy "${version}@100%" --yes --message "measure ${round}/${rounds}" > /dev/null
            # A fixed wait, not a poll: a poll would be each fresh isolate's first request,
            # and that request's cost (cold=1) is what the round's first route measures.
            sleep $([ "$FOCUS" = 1 ] && echo 10 || echo 20)
            FOCUS="$FOCUS" EXPECT="$version" SENT_FILE="$RUNNER_TEMP/sent" node scripts/measure-load.mjs "$BASE" "$round"
          done
      - name: Summary
        if: always()
        run: |
          set -uo pipefail
          sleep 20
          pkill -f "$WRANGLER tail" || true
          sent="$(awk '{ s += $1 } END { print s + 0 }' "$RUNNER_TEMP/sent" 2>/dev/null || echo 0)"
          # Exit 1: a route at or over 8 ms (the gate). Exit 2: the tail sampled, so no verdict.
          node scripts/cpu-summary.mjs "$RUNNER_TEMP/tail.jsonl" 8 "$sent" || status=$?
          tail -5 "$RUNNER_TEMP/tail.err" || true
          exit "${status:-0}"
      - name: Keep the raw tail
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: c4n-api-measure
          path: ${{ runner.temp }}/tail.jsonl
          retention-days: 14
