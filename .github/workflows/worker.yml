# c4n-api: tests and deploys the function as the Cloudflare Worker at
# api.confused4now.org (wrangler.toml, worker/index.mjs). The only way it deploys:
# never from a laptop.
#
# Runs on every push to main here, by hand, and from textbook-registry's deploy.yml
# (workflow_call) after every registry change, because the registry is baked in at
# build time (scripts/bundle-registry.mjs), as on Vercel. Either way it deploys this
# repo's main (or the pushed commit) with the registry's main.
#
# Needs CLOUDFLARE_WORKERS_TOKEN (Workers Scripts, Workers KV and D1 edit on the
# account; Workers Routes edit and Zone read on confused4now.org). The account id is
# read from the zone. Without the token the tests still run and the deploy is skipped
# with a warning. The Worker's secrets are set by worker-secrets.yml, by hand; a
# deploy keeps them.
name: worker

on:
  push:
    branches: [main]
  pull_request: # the tests only
  workflow_dispatch:
  workflow_call:
    secrets:
      CLOUDFLARE_WORKERS_TOKEN:
        required: false

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('c4n-api-test-{0}', github.ref) || 'c4n-api-deploy' }}
  cancel-in-progress: false

env:
  WRANGLER: wrangler@4.142.0
  WRANGLER_SEND_METRICS: 'false'
  ENDPOINT: https://api.confused4now.org/api/suggest-edit

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          repository: textbookproject2026-alt/suggest-edit-function
          # Called from the registry, github.sha is the registry's commit: deploy main.
          ref: ${{ github.repository == 'textbookproject2026-alt/suggest-edit-function' && github.sha || 'main' }}
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Bundle the registry and run the tests, directly and through the Worker's adapter
        run: |
          set -euo pipefail
          npm ci
          FUNCTION_SHA="$(git rev-parse HEAD)" npm run registry:bundle
          npm test
          npm run test:worker
          echo "FUNCTION_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      # Every endpoint's CPU on the Worker's code path, replayed from recorded GitHub
      # answers (fixtures/cpu/, scripts/cpu-bench.mjs): a fresh isolate's first request
      # and warm ones, in est. Cloudflare ms. Over 7 or 8.5 ms only warns here: the same
      # code measures 6.7-9.3 ms from one runner to the next (Nov 2026), and the live
      # alarm (cpu-live.yml, error 1102) is what fails. An endpoint answering 5xx fails.
      - name: CPU budget per endpoint (recorded fixtures, warning only)
        if: github.event_name != 'pull_request'
        env:
          BENCH_WARN_ONLY: '1'
        run: |
          set -euo pipefail
          node scripts/cpu-bench.mjs "${CPU_BUDGET_MS:-7}" | grep -v '^config:'

      # A pull request: against main, in this job on this runner. main is checked out
      # beside it and both are measured with this branch's bench (main's own fixtures),
      # three times each, taking turns which goes first; per endpoint the median of the
      # runs. More than 15% slower than main fails (scripts/cpu-compare.mjs). The
      # absolute figures are printed from the first run, as warnings.
      - uses: actions/checkout@v6
        if: github.event_name == 'pull_request'
        with:
          ref: main
          path: base
          persist-credentials: false

      - name: CPU against main (same runner, 3 runs each, more than 15% slower fails)
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          cp scripts/cpu-bench.mjs base/scripts/cpu-bench.mjs
          (cd base && npm ci --silent && FUNCTION_SHA="$(git rev-parse HEAD)" npm run registry:bundle >/dev/null)
          # This branch's (the first run's table is shown, with its warnings) and main's.
          pr() {
            if [ "$1" = 1 ]; then out=/dev/stdout; else out=/dev/null; fi
            BENCH_WARN_ONLY=1 BENCH_OUT="$RUNNER_TEMP/head$1.json" node scripts/cpu-bench.mjs "${CPU_BUDGET_MS:-7}" | grep -v '^config:' > "$out"
          }
          main() { (cd base && BENCH_WARN_ONLY=1 BENCH_OUT="$RUNNER_TEMP/base$1.json" node scripts/cpu-bench.mjs > /dev/null); }
          for i in 1 2 3; do
            if [ $((i % 2)) = 1 ]; then pr $i; main $i; else main $i; pr $i; fi
          done
          node scripts/cpu-compare.mjs "$RUNNER_TEMP/base1.json,$RUNNER_TEMP/base2.json,$RUNNER_TEMP/base3.json" \
            "$RUNNER_TEMP/head1.json,$RUNNER_TEMP/head2.json,$RUNNER_TEMP/head3.json"

      - name: Find the account, the KV namespace and the D1 database
        id: cf
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::warning::CLOUDFLARE_WORKERS_TOKEN is not set here, so c4n-api was NOT deployed. The tests passed."
            echo "ready=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          scripts/cloudflare-bindings.sh
          echo "ready=yes" >> "$GITHUB_OUTPUT"

      - name: Migrate D1 and deploy
        if: steps.cf.outputs.ready
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_TOKEN }}
        run: |
          set -euo pipefail
          npx -y "$WRANGLER" d1 migrations apply c4n-api --remote
          npx -y "$WRANGLER" deploy

      - name: Wait for api.confused4now.org to serve this commit
        if: steps.cf.outputs.ready
        run: |
          set -euo pipefail
          # Every response carries the header, refusals included. Ten minutes at most:
          # the first deploy waits for the custom domain's certificate.
          # || true: on the first deploy the name may not resolve yet (curl exit 6).
          for i in $(seq 30); do
            now="$(curl -s --max-time 20 -o /dev/null -D - -X OPTIONS "$ENDPOINT" | tr -d '\r' \
              | awk 'tolower($1) == "x-function-version:" { print $2 }' || true)"
            if [ "$now" = "$FUNCTION_SHA" ]; then echo "$ENDPOINT serves function $now."; exit 0; fi
            echo "  still serving ${now:-<no answer>}"
            sleep 20
          done
          echo "::error::$ENDPOINT is not serving function $FUNCTION_SHA ten minutes after the deploy."
          exit 1
