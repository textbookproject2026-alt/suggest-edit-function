# Is c4n-api's cron firing? scripts/cron-check.sh: cron triggers on every script, the
# deployed handlers and cron strings, and the scheduled invocations Cloudflare logged.
name: cron-check

on:
  workflow_dispatch:
    inputs:
      hours:
        description: How many hours back to look
        default: '3'
  pull_request:
    paths: [scripts/cron-check.sh, .github/workflows/cron-check.yml]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: scripts/cron-check.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_TOKEN }}
          HOURS: ${{ inputs.hours || '72' }}
